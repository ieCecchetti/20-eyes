name: ChillyEye
options:
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
packages:
  ChillyCore:
    path: Core
targets:
  ChillyEye:
    type: application
    platform: macOS
    sources: [App]
    dependencies:
      - package: ChillyCore
      - target: ChillyEyeWidget
    info:
      path: App/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Chilly Eye
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.healthcare-fitness
        AppGroupID: $(TeamIdentifierPrefix)com.cecchetti.chillyeye
    entitlements:
      path: App/ChillyEye.entitlements
      properties:
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)com.cecchetti.chillyeye
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cecchetti.chillyeye
        PRODUCT_NAME: Chilly Eye
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  ChillyEyeWidget:
    type: app-extension
    platform: macOS
    sources: [Widget]
    dependencies:
      - package: ChillyCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: Widget/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Chilly Eye
        AppGroupID: $(TeamIdentifierPrefix)com.cecchetti.chillyeye
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/ChillyEyeWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)com.cecchetti.chillyeye
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cecchetti.chillyeye.widget
